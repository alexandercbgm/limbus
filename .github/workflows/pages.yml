# Builds the Telegram Mini App (python3 build.py --telegram) and publishes it on GitHub Pages at every push to main.
# Pages must be set to deploy from GitHub Actions: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Telegram build on Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # build.py re-encodes the tracks when the runner has ffmpeg, else copies them as they are
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 build.py --telegram
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/telegram
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
